[package]
name = "nrzx-ui"
version = "1.0.0"
edition = "2024"
description = "Oberfläche von nrzX – Dioxus 0.7 (WebAssembly) mit Komponenten von rust-ui"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
nrzx-shared = { path = "../shared" }
dioxus = { version = "0.7", default-features = false, features = ["web", "router", "macro", "html", "signals", "hooks", "launch", "logger"] }
icons = { version = "0.19", features = ["dioxus"] }
tw_merge = "0.1"
strum = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Blob", "DataTransfer", "DataTransferItem", "DataTransferItemList", "DragEvent", "Element", "Event", "File", "FileList", "FormData", "HtmlElement", "CssStyleDeclaration",
  "HtmlInputElement", "HtmlTextAreaElement", "Location", "Storage", "Url", "Window", "Document",
  "KeyboardEvent", "MouseEvent", "ClipboardEvent", "Navigator", "Clipboard", "UrlSearchParams",
  "Node", "NodeList", "History", "EventTarget", "HtmlDocument", "DomTokenList", "MediaQueryList",
  "ScrollIntoViewOptions", "ScrollToOptions", "ScrollBehavior", "ScrollLogicalPosition",
  "EventSource", "MessageEvent", "HtmlIFrameElement",
  "XmlHttpRequest", "XmlHttpRequestUpload", "XmlHttpRequestEventTarget", "ProgressEvent",
  "Selection", "DomRect",
  # Dieter: Mikrofon, Web Audio, Vorlesen
  "MediaDevices", "console", "MediaStream", "MediaStreamConstraints", "MediaStreamTrack", "AudioContext", "BaseAudioContext",
  "MediaStreamAudioSourceNode", "ScriptProcessorNode", "AudioProcessingEvent", "AudioBuffer", "AudioNode",
  "AudioDestinationNode", "GainNode", "AudioParam", "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice",
  # Canvas: Rad/Pinch ohne passive Listener
  "WheelEvent", "AddEventListenerOptions",
  # Profilbild: zuschneiden und verkleinern
  "HtmlImageElement", "HtmlCanvasElement", "CanvasRenderingContext2d",
] }
urlencoding = "2"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Nicht strippen: neuere objcopy-Versionen entfernen die Daten, die wasm-bindgen braucht.
# wasm-opt (dx bundle) entfernt danach ohnehin alles Unnötige.
strip = false
panic = "abort"
