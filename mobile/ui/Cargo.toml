[package]
name = "nrzx-mobile-ui"
version = "1.0.0"
edition = "2024"
description = "Oberfläche von nrzXMobile – Dioxus 0.7 (WebAssembly), für das Handy"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
nrzx-shared = { path = "../../shared" }
dioxus = { version = "0.7", default-features = false, features = ["web", "macro", "html", "signals", "hooks", "launch", "logger"] }
icons = { version = "0.19", features = ["dioxus"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Storage", "EventSource", "MessageEvent", "Event", "Element", "HtmlElement", "HtmlTextAreaElement", "Navigator", "Clipboard", "DomTokenList", "EventTarget", "HtmlHeadElement"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = false
panic = "abort"
