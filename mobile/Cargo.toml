[package]
name = "nrzx-mobile"
version = "1.0.0"
edition = "2024"
description = "nrzXMobile – nrzX für unterwegs: Server auf dem Umbrel, mit dem sich nrzX am PC verbindet"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
flate2 = "1"

[build-dependencies]
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
